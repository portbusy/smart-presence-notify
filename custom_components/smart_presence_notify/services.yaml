send:
  name: Send Notification
  description: Send a presence-aware notification. Delivered to home members or queued for the first person who returns.
  fields:
    title:
      name: Title
      description: Notification title.
      required: true
      selector:
        text:
    message:
      name: Message
      description: Notification body.
      required: true
      selector:
        text:
    priority:
      name: Priority
      description: "High priority skips the queue and triggers a device alert. Delivered immediately to the first home member; if nobody is home, uses the fallback service (or queues if no fallback is set)."
      required: false
      default: normal
      selector:
        select:
          options:
            - normal
            - high
    target_override:
      name: Target Override
      description: Send directly to a notify service or entity, bypassing presence. Companion channels are selected automatically from the payload.
      required: false
      selector:
        text:
    targets:
      name: Targets
      description: List of notify services or entities to use in caller-defined mode.
      required: false
      selector:
        object:
    data:
      name: Extra Data
      description: Extra data selects an advanced notification channel. For Companion Live Activities, include live_update true and a stable tag.
      required: false
      selector:
        object:
    response_preset:
      name: Response Preset
      description: Optional preset for actionable Companion App notifications. Currently supports Yes/No.
      required: false
      selector:
        select:
          options:
            - yes_no
    response_id:
      name: Response ID
      description: Required with a response preset. Identifies the question in smart_presence_notify_response events.
      required: false
      selector:
        text:

retry_pending:
  name: Retry Pending Notifications
  description: Restart delivery attempts for pending messages after repairing notification destinations.
