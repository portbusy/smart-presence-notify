name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.14"
            ha-version: "2026.9.4"
            pytest-ha-version: "0.13.367"
          - python-version: "3.14"
            ha-version: "2026.10.2"
            pytest-ha-version: "0.13.372"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install \
            pytest-homeassistant-custom-component==${{ matrix.pytest-ha-version }} \
            "pytest-asyncio==1.4.0"
          # Exercise the selected patch release with its runtime dependencies,
          # even when the fixture package pins an earlier patch.
          pip install --upgrade homeassistant==${{ matrix.ha-version }}

      - name: Run tests
        run: pytest tests/ -v --tb=short
