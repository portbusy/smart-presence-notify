name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.14"
            ha-version: "2026.7.1"
            pytest-ha-version: "0.13.345"
          - python-version: "3.14"
            ha-version: "2026.7.2"
            pytest-ha-version: "0.13.346"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install \
            homeassistant==${{ matrix.ha-version }} \
            pytest-homeassistant-custom-component==${{ matrix.pytest-ha-version }} \
            "pytest-asyncio>=1.4.0"

      - name: Run tests
        run: pytest tests/ -v --tb=short
