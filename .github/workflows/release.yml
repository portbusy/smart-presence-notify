name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Verify manifest version
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('custom_components/smart_presence_notify/manifest.json')
          m = json.loads(p.read_text())
          expected = '${{ steps.version.outputs.version }}'
          actual = m['version']
          if actual != expected:
              raise SystemExit(f'manifest version {actual} does not match tag {expected}')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
